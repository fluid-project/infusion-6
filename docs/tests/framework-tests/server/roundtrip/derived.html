<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Hydration round trip</title>
        <!-- A minimal page for hydrate-roundtrip-test.js, as index.html, but importing a Single File Component with no
             template of its own, which derives from, and alone imports, the root of the fixture -->
        <!-- The one reference to the location of Infusion - every other is relative, or through a module -->
        <script src="../../../../src/framework/core/js/FluidBoot.js"></script>
        <!-- The module holding the page, and its map of the modules it depends upon -->
        <fluid-module id="fluid-tests-rt" src="./" modules="fluid-modules.json"></fluid-module>
        <fluid-import src="sfc/fluid-tests-rt-derived.vue"></fluid-import>
        <script>
            "use strict";
            // A runnable application of the fixture, rendered from its real data, relative to this page
            fluid.def("fluid.tests.rt.derivedPage", {
                $layers: "fluid.tests.rt.derived",
                recordsUrl: "data/records.json"
            });
        </script>
    </head>
    <body>
        <div fluid-layers="fluid.tests.rt.derivedPage"></div>
    </body>
</html>
