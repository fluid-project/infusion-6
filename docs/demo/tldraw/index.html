<!DOCTYPE html><html>
<head>
    <meta charset="UTF-8">
    <title>Infusion in tldraw (React lifecycle)</title>

    <fluid-module id="infusion-6" src="../../"></fluid-module>

    <script src="../../src/lib/lezer/lezer-javascript-browser.js" fluid-hydrated="%infusion-6"></script>

    <script src="../../src/framework/core/js/FluidCore.js" fluid-hydrated="%infusion-6"></script>
    <script src="../../src/framework/core/js/FluidSignals.js" fluid-hydrated="%infusion-6"></script>
    <script src="../../src/framework/core/js/Fluid.js" fluid-hydrated="%infusion-6"></script>
    <script src="../../src/framework/core/js/FluidModules.js" fluid-hydrated="%infusion-6"></script>
    <script src="../../src/framework/core/js/FluidIL.js" fluid-hydrated="%infusion-6"></script>
    <script src="../../src/framework/core/js/FluidView.js" fluid-hydrated="%infusion-6"></script>
    <script src="../../src/framework/core/js/FluidPTF.js" fluid-hydrated="%infusion-6"></script>
    <script src="../../src/framework/core/js/FluidView-browser.js" fluid-hydrated="%infusion-6"></script>
    <script src="../../src/framework/core/js/template-parser.js" fluid-hydrated="%infusion-6"></script>
    <script src="../../src/framework/core/js/sfc-parser.js" fluid-hydrated="%infusion-6"></script>

    <fluid-module id="tldrawDemo" src="./"></fluid-module>

    <fluid-import src="%tldrawDemo/sfc/fluid-demos-helloWorld.vue" fluid-hydrated="%tldrawDemo"></fluid-import>
    <fluid-import src="%tldrawDemo/sfc/fluid-demos-counter.vue" fluid-hydrated="%tldrawDemo"></fluid-import>
    <fluid-import src="%tldrawDemo/sfc/fluid-demos-storyTime.vue" fluid-hydrated="%tldrawDemo"></fluid-import>
    <fluid-import src="%tldrawDemo/sfc/fluid-demos-storySegment.vue" fluid-hydrated="%tldrawDemo"></fluid-import>
    <fluid-import src="%tldrawDemo/sfc/fluid-demos-storyImageGen.vue" fluid-hydrated="%tldrawDemo"></fluid-import>
    <fluid-import src="%tldrawDemo/sfc/fluid-demos-imageGenerator.vue" fluid-hydrated="%tldrawDemo"></fluid-import>
    <fluid-import src="%tldrawDemo/sfc/fluid-demos-closestNoteFinder.vue" fluid-hydrated="%tldrawDemo"></fluid-import>
    <fluid-import src="%tldrawDemo/sfc/fluid-demos-askAnything.vue" fluid-hydrated="%tldrawDemo"></fluid-import>
    <fluid-import src="%tldrawDemo/sfc/fluid-demos-askAnythingEntry.vue" fluid-hydrated="%tldrawDemo"></fluid-import>

    <!-- Stubs for the "#Agents" widget helpers used by the story time widget -->
    <script src="js/agents-stubs.js"></script>
    <!-- Hosting machinery, and the protocol of the "Ask me anything" AI panel, which do not depend on tldraw -->
    <script src="js/tldraw-hosting.js"></script>
    <script src="js/ai-protocol.js"></script>
    <!-- Renders the AI's responses as markdown -->
    <script src="../../src/lib/snarkdown/snarkdown.umd.js"></script>
    <script src="js/markdown-block.js"></script>
    <!-- Image search for the image widget -->
    <script src="js/pixabay.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="https://esm.sh/tldraw@5.5.2/tldraw.css">

    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@19.3.1",
            "react-dom/client": "https://esm.sh/react-dom@19.3.1/client?deps=react@19.3.1",
            "tldraw": "https://esm.sh/tldraw@5.5.2?deps=react@19.3.1,react-dom@19.3.1"
        }
    }
    </script>

    <style>
        :root {
            /* tldraw's UI inherits its font, and refers to this variable in some places */
            --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
            --ai-panel-width: 360px;
        }
        html, body {
            margin: 0;
            height: 100%;
        }
        body {
            font-family: var(--font-body);
        }
        .top-panel {
            /* Above tldraw's style panel, a later sibling at z-index 300, which the open layer list would otherwise fall
               beneath */
            position: relative;
            z-index: 301;
            pointer-events: all;
            display: flex;
            gap: 6px;
            margin: 8px;
        }
        .new-shape-panel, .history-buttons {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px;
            background: var(--color-panel, white);
            border-radius: 9px;
            box-shadow: var(--shadow-2, 0 1px 4px rgba(0, 0, 0, 0.2));
        }
        .history-button {
            font: inherit;
            font-size: 16px;
            line-height: 1;
            padding: 4px 6px;
            cursor: pointer;
        }
        .history-button:disabled {
            cursor: default;
        }
        .history-caption {
            font-size: 12px;
            color: #616161;
        }
        .layer-picker {
            position: relative;
        }
        .layer-picker-button {
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: 280px;
        }
        .layer-picker-choice {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .layer-picker-list {
            position: absolute;
            top: calc(100% + 4px);
            right: 0;
            z-index: 10;
            min-width: 100%;
            max-height: 360px;
            overflow-y: auto;
            margin: 0;
            padding: 4px 0;
            list-style: none;
            background: var(--color-panel, white);
            border-radius: 8px;
            box-shadow: var(--shadow-3, 0 2px 10px rgba(0, 0, 0, 0.25));
        }
        .layer-picker-option {
            display: flex;
            align-items: center;
        }
        .layer-picker-option:hover, .layer-picker-chosen {
            background: rgba(0, 0, 0, 0.05);
        }
        .new-shape-panel .layer-picker-name {
            flex: 1;
            padding: 6px 10px;
            text-align: left;
            white-space: nowrap;
            background: none;
            border: none;
        }
        .new-shape-panel .layer-picker-delete {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            align-self: stretch;
            padding: 0;
            color: #C62828;
            background: none;
            border: none;
            /* Revealed only as the pointer passes over the right of its row */
            opacity: 0;
        }
        .new-shape-panel .layer-picker-delete:hover, .new-shape-panel .layer-picker-delete:focus-visible {
            opacity: 1;
        }
        .new-shape-panel select, .new-shape-panel button {
            font: inherit;
            font-size: 13px;
            padding: 4px 8px;
        }
        .new-shape-panel button {
            cursor: pointer;
        }
        #tldraw-root {
            position: fixed;
            inset: 0 var(--ai-panel-width) 0 0;
        }
        .infusion-host-problems {
            display: flex;
            flex-direction: column;
            gap: 6px;
            height: 100%;
            box-sizing: border-box;
            padding: 10px;
            overflow: auto;
            font-size: 12px;
            color: #B71C1C;
            background-color: #FFEBEE;
            user-select: text;
        }
        #ai-root {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: var(--ai-panel-width);
        }
    </style>
</head>
<body>
<!-- tldraw mounts here; its Infusion shapes construct and destroy their component explicitly from React lifecycle hooks -->
<div id="tldraw-root"></div>
<!-- The "Ask me anything" panel, through which an AI may reflect on and alter the workspace -->
<div id="ai-root" fluid-layers="fluid.demos.askAnything"></div>
<script type="module" src="js/tldraw-driver.js"></script>
</body>
</html>
