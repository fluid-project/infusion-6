<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Review commit - Edit in Infusion</title>
    <link rel="stylesheet" href="css/common.css">
    <style>
        :root { --accent: #2b6cb0; --muted: #555; --line: #dde3ea; }
        /* The window's height is shared between its head, the edits reviewed, which scroll, and its buttons, which are
           always in view beneath them */
        html, body { height: 100%; }
        body { font: 14px/1.45 system-ui, sans-serif; margin: 0; padding: 16px; box-sizing: border-box; color: #1a202c;
            background: #fff; display: flex; flex-direction: column; }
        body > * { flex: none; }
        #claims { flex: 1 1 auto; min-height: 80px; overflow-y: auto; margin: 0 0 10px; }
        h1 { font-size: 17px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
        p { margin: 0 0 10px; }
        dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; margin: 0 0 12px; }
        dt { color: var(--muted); }
        dd { margin: 0; word-break: break-all; }
        ul { margin: 0 0 12px; padding-left: 20px; }
        /* Each diff is shown whole, the edits about it scrolling together */
        .diff { font-size: 12.5px; line-height: 1.4; border: 1px solid var(--line); border-radius: 6px; margin: 0 0 12px;
            white-space: pre-wrap; overflow-wrap: anywhere; }
        .diff div { padding: 0 8px; }
        .diff .add { background: #e6ffed; }
        .diff .del { background: #ffeef0; text-decoration: line-through; color: #86181d; }
        .diff .skip { color: var(--muted); font-style: italic; }
        .buttons { display: flex; gap: 8px; }
        button { font: inherit; font-weight: 600; padding: 8px 14px; border-radius: 6px; cursor: pointer; }
        #approve { border: 0; background: var(--accent); color: #fff; }
        #approve:disabled { background: #a0aec0; cursor: not-allowed; }
        #decline { border: 1px solid var(--line); background: #fff; }
        .note { color: var(--muted); font-size: 12.5px; }
        .claim { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin: 0 0 12px; }
        .claim > label { display: flex; gap: 8px; align-items: baseline; font-weight: 600; cursor: pointer; }
        .claim .claim-path { word-break: break-all; }
        .claim .claim-page { color: var(--muted); font-size: 12.5px; margin: 2px 0 6px 24px; }
        .claim ul { margin: 0 0 6px 24px; }
        .claim .diff { margin: 0; }
        .claim.unchosen .diff, .claim.unchosen ul { opacity: 0.45; }
    </style>
</head>
<body>
    <h1><img src="icons/icon-32.png" alt="" width="24" height="24"> Review commit</h1>
    <p>A page you are editing asks to commit, as you, to GitHub. Every edit held in this browser for the same branch is
        listed - commit those you choose, together as one commit, and only if they are the edits you made.</p>
    <dl>
        <dt>Repository</dt><dd id="repo" class="fl-monospace"></dd>
        <dt>Branch</dt><dd id="branch" class="fl-monospace"></dd>
        <dt>Files</dt><dd id="path" class="fl-monospace"></dd>
    </dl>
    <div id="claims"></div>
    <p class="status" id="status" role="status"></p>
    <div class="buttons">
        <button id="approve" disabled>Commit chosen</button>
        <button id="decline">Don't commit</button>
    </div>
    <script src="js/confirm.js"></script>
</body>
</html>
