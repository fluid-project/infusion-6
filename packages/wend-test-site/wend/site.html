<!DOCTYPE html>

    <meta charset="utf-8">
    <!-- Host document for wend's build, js/buildSite.js of the wend package: declares Infusion and this site's SFCs, and renders nothing itself.
         The rendered pages are separate documents, one per beautifulWend.document.
         Under node Infusion is already loaded, and FluidBoot.js only declares the module infusion-6 at the directory
         holding it. Its files are read from the checkout which buildSite.js locates - that named for infusion-6 by
         the site's moduleOverrides.json5, or else the one installed in node_modules. -->
    <script src="../node_modules/infusion-6/src/framework/core/js/FluidBoot.js"></script>

    <!-- The site's modules, as wend.site.json names them: wend's own SFCs, its theme's, and the site's -->
    <fluid-module id="wend" src="../node_modules/wend/"></fluid-module>
    <fluid-module id="beautifulWend" src="../node_modules/wend-theme-beautiful/"></fluid-module>
    <fluid-module id="testSite" src="./"></fluid-module>

    <!-- Every SFC of the site's modules, listed one by one, since Infusion has no import of a whole directory -->
